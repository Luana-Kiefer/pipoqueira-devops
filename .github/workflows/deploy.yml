name: Pipeline Pipoqueira DevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Testar a aplicacao (CI)
      run: |
        python -c "import app; print('Testes concluidos com sucesso!')"

    - name: Criar imagem Docker (Build)
      run: |
        docker build -t pipoqueira-devops:latest .